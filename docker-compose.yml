x-backend-environment: &backend_environment
  # Django
  SECRET_KEY: ${SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG}
  USE_HTTPS: ${USE_HTTPS}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  FRONTEND_URL: ${FRONTEND_URL}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  CRON_TOKEN: ${CRON_TOKEN}
  
  # Base de datos
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_SSLMODE: ${DB_SSLMODE}

  # Almacenamiento
  STORAGE_BACKEND_CLASS: ${STORAGE_BACKEND_CLASS}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL}
  STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL}
  STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  STORAGE_REGION: ${STORAGE_REGION}

  # Subidas y cuota
  RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES}
  PAID_PLANS_ENABLED: ${PAID_PLANS_ENABLED}

  # Correo
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES}
  EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES}

  # Pagos simulados
  PAYMENTS_IDEMPOTENCY_SECRET: ${PAYMENTS_IDEMPOTENCY_SECRET}

services:
  backend:
    build: ./backend-nimsutz
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend-nimsutz:/app
    environment: *backend_environment
    depends_on:
      - db
      - minio

  subscription_worker:
    build: ./backend-nimsutz
    command: python manage.py watch_subscriptions --interval 60
    restart: unless-stopped
    volumes:
      - ./backend-nimsutz:/app
    environment: *backend_environment
    depends_on:
      - db

  cleanup:
    build: ./backend-nimsutz
    command: sh -c "while true; do python manage.py cleanup_expired_uploads; sleep 60; done"
    restart: unless-stopped
    volumes:
      - ./backend-nimsutz:/app
    environment: *backend_environment
    depends_on:
      - db
      - minio

  frontend:
    build: ./frontend-nimsutz
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-nimsutz:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pg_data:
  minio_data:
